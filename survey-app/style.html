<style>
  :root {
    --bg: #11151b;
    --surface: #182029;
    --surface-2: #1f2933;
    --line: #2c3845;
    --text: #dbe2ea;
    --muted: #8d9aa8;
    --accent: #7c9bb8;
    --accent-strong: #a9c1d8;
    --accent-ink: #0f1a24;
    --danger: #d08a8a;
    --ok: #8fb59a;
    --radius: 14px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Pretendard", "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 120px; }
  .wrap.wide { max-width: 1180px; }
  h1 { font-size: 22px; font-weight: 700; margin: 8px 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 18px; font-weight: 700; margin: 0 0 8px; }
  h3 { font-size: 15px; font-weight: 700; margin: 0 0 8px; color: var(--accent-strong); }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin: 14px 0; }
  .eyebrow { font-size: 12px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
  .pre { white-space: pre-wrap; }

  label.field { display: block; margin: 14px 0 6px; font-size: 14px; color: var(--muted); }
  input[type=text], input[type=number], input[type=password], input[type=search], select {
    width: 100%; padding: 13px 14px; font-size: 16px; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }

  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choices button {
    flex: 1 1 auto; min-height: 46px; padding: 8px 12px; font-size: 15px; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
  }
  .choices button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 48px; padding: 0 22px; font-size: 16px; font-weight: 700; border-radius: 12px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent);
  }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--line); font-weight: 500; }
  .btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
  .btn:disabled { opacity: 0.45; cursor: default; }

  .progress { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 8px; }
  .bar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width 0.3s; }
  .progress .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }

  .item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 12px 0; }
  .item.missing { border-color: var(--danger); }
  .item .q { margin-bottom: 12px; }
  .item .q b { color: var(--muted); font-weight: 500; margin-right: 6px; font-size: 14px; }
  .scale { display: grid; gap: 6px; }
  .scale button {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    min-height: 54px; padding: 6px 2px; color: var(--text); font-size: 17px; font-weight: 700;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
  }
  .scale button small { font-size: 10.5px; font-weight: 400; color: var(--muted); line-height: 1.25; text-align: center; word-break: keep-all; }
  .scale button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .scale button.on small { color: var(--accent-ink); }
  .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; }

  .footer { position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); padding: 22px 16px calc(14px + env(safe-area-inset-bottom)); }
  .footer .in { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; }
  .footer .btn { flex: 1; }
  .err { color: var(--danger); font-size: 14px; min-height: 20px; margin-top: 8px; }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; cursor: pointer; }
  .check input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--accent); }
  .center { text-align: center; }
  .loading { padding: 60px 0; text-align: center; color: var(--muted); }

  /* 관리자 */
  .top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .top .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 16px 0 4px; overflow-x: auto; }
  .tabs button { background: none; border: 0; color: var(--muted); padding: 10px 14px; font-size: 15px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .stat .v { font-size: 26px; font-weight: 700; }
  .stat .k { font-size: 13px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .hbar { display: grid; grid-template-columns: 88px 1fr 44px; gap: 8px; align-items: center; font-size: 14px; margin: 6px 0; }
  .hbar .t { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .hbar .t i { display: block; height: 100%; background: var(--accent); }
  .hbar .n { text-align: right; color: var(--muted); }
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: var(--surface-2); color: var(--muted); font-weight: 600; position: sticky; top: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: var(--surface-2); }
  tr.click { cursor: pointer; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .alpha-low { color: var(--danger); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .toolbar > * { flex: 1 1 200px; }
  .drawer { position: fixed; inset: 0; background: rgba(5, 8, 12, 0.6); display: none; z-index: 20; }
  .drawer.open { display: block; }
  .drawer .panel { position: absolute; right: 0; top: 0; bottom: 0; width: min(560px, 100%); background: var(--bg); border-left: 1px solid var(--line); overflow-y: auto; padding: 18px 16px 40px; }
</style>
